# 构建 MCP + 网页版两个 Docker 镜像并推送到 Docker Hub
# 触发：推送到部署分支 truenas-web-docker 或打 tag v*，每次同时推送 <版本号> 与 latest 两个 tag
# 前提：仓库 Secrets 里设置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（用户 Docker Hub 账号 + 访问令牌）
# NAS 更新流程：git pull → bash deploy/run.sh（docker compose pull && up -d）

name: Docker Images

on:
  push:
    branches: [truenas-web-docker]
    tags: ['v*']
  workflow_dispatch:

env:
  # 镜像版本号，后续按需增加；compose 里 image 的 tag 与此保持一致
  IMAGE_VERSION: 0.1.2

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: build & push (mcp + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push MCP image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oh-my-sage-mcp:${{ env.IMAGE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/oh-my-sage-mcp:latest

      - name: Build & push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oh-my-sage-web:${{ env.IMAGE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/oh-my-sage-web:latest
